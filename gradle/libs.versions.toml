[versions]
agp = "9.1.0"
kotlin = "2.2.10"
# KSP 2.3.4+ is the first line that works with AGP 9's built-in Kotlin compilation.
ksp = "2.3.11"
room = "2.8.4"

# Pinned to the newest releases that still build against the installed android-36.1 platform.
# Anything newer sets an AAR minimum compileSdk of 37, which is not installed here.
activity = "1.11.0"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
coreKtx = "1.17.0"
coroutines = "1.10.2"
datastore = "1.1.7"
dynamicanimation = "1.1.0"
espressoCore = "3.6.1"
fragment = "1.8.9"
junit = "4.13.2"
junitVersion = "1.2.1"
lifecycle = "2.9.4"
material = "1.13.0"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
browser = "1.8.0"
play-services-ads = "23.6.0"
firebaseBom = "33.12.0"
googleServices = "4.4.2"
firebaseCrashlyticsPlugin = "3.0.3"
onesignal = "5.1.35"
facebook-core = "18.0.3"
install-referrer = "2.2"
sdp = "1.1.1"
ssp = "1.1.1"

[libraries]
sdp-android = { group = "com.intuit.sdp", name = "sdp-android", version.ref = "sdp" }
ssp-android = { group = "com.intuit.ssp", name = "ssp-android", version.ref = "ssp" }

androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-dynamicanimation = { group = "androidx.dynamicanimation", name = "dynamicanimation", version.ref = "dynamicanimation" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "play-services-ads" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
onesignal = { group = "com.onesignal", name = "OneSignal", version.ref = "onesignal" }
facebook-core = { group = "com.facebook.android", name = "facebook-core", version.ref = "facebook-core" }
install-referrer = { group = "com.android.installreferrer", name = "installreferrer", version.ref = "install-referrer" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
